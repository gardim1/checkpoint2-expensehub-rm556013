name: expensehub-cp3

services:
  rabbitmq:
    image: rabbitmq:4.1-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:?Configure RABBITMQ_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?Configure RABBITMQ_PASSWORD}"
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    image: ghcr.io/gardim1/expensehub-web:${IMAGE_TAG:?Configure IMAGE_TAG with the delivered commit}
    environment:
      ConnectionStrings__ExpenseHub: Data Source=/data/expensehub.db;Default Timeout=30
      SeedAdmin__Email: "${SEED_ADMIN_EMAIL:?Configure SEED_ADMIN_EMAIL}"
      SeedAdmin__Password: "${SEED_ADMIN_PASSWORD:?Configure SEED_ADMIN_PASSWORD}"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__User: "${RABBITMQ_USER}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD}"
      RabbitMQ__Queue: expensehub.reports
      DataProtection__Path: /keys
      Logging__LogLevel__Microsoft.EntityFrameworkCore: Warning
    ports:
      - "127.0.0.1:5245:8080"
    volumes:
      - app-data:/data
      - identity-keys:/keys
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /health HTTP/1.0\r\n\r\n' >&3; grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 5s
      retries: 30

  worker:
    image: ghcr.io/gardim1/expensehub-worker:${IMAGE_TAG:?Configure IMAGE_TAG with the delivered commit}
    environment:
      ConnectionStrings__ExpenseHub: Data Source=/data/expensehub.db;Default Timeout=30
      RabbitMQ__Host: rabbitmq
      RabbitMQ__User: "${RABBITMQ_USER}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD}"
      RabbitMQ__Queue: expensehub.reports
      Logging__LogLevel__Microsoft.EntityFrameworkCore: Warning
    volumes:
      - app-data:/data
    depends_on:
      web:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  app-data:
  identity-keys:
  rabbitmq-data:
