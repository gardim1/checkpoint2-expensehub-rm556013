name: cp3-images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build without warnings
        run: dotnet build sources/ExpenseHub.slnx -c Release --warnaserror
      - name: Unit tests before publishing
        run: dotnet test sources/ExpenseHub.slnx -c Release --no-build
      - name: Verify formatting
        run: dotnet format sources/ExpenseHub.slnx --no-restore --verify-no-changes
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/gardim1/expensehub-web:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: ghcr.io/gardim1/expensehub-worker:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Publish image bundle for correction without registry credentials
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          docker pull --quiet ghcr.io/gardim1/expensehub-web:${GITHUB_SHA}
          docker pull --quiet ghcr.io/gardim1/expensehub-worker:${GITHUB_SHA}
          docker save ghcr.io/gardim1/expensehub-web:${GITHUB_SHA} ghcr.io/gardim1/expensehub-worker:${GITHUB_SHA} | gzip > expensehub-images.tar.gz
          sha256sum expensehub-images.tar.gz > expensehub-images.sha256
          gh release create "cp3-${GITHUB_SHA}" expensehub-images.tar.gz expensehub-images.sha256 --target "${GITHUB_SHA}" --title "ExpenseHub CP3 — ${GITHUB_SHA}" --notes "Duas imagens reais da versão identificada pelo commit. Baixe expensehub-images.tar.gz e execute: docker load -i expensehub-images.tar.gz. Configure .env com este SHA; docker compose pull --policy missing; docker compose up -d. Não contém credenciais nem banco de execução."
